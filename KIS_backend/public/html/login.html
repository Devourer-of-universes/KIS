<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - КИС</title>
    <link rel="stylesheet" type="text/css" href="/styles/main.css">
    <link rel="stylesheet" type="text/css" href="/styles/login.css">
</head>
<body>
    <div id="enterbody">
        <div class="log_page_window" id="loginwindow">
            <h1 class="text-header">Авторизация</h1>
            
            <div class="inputelem_container text-inner-header">
                <label>Логин / Email</label>
                <input class="inputelem" type="text" id="loginInput" placeholder="Введите логин или email">
            </div>
            
            <div class="inputelem_container text-inner-header">
                <label>Пароль</label>
                <input class="inputelem" type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            
            <button class="buttonbase log_page_button" id="loginBtn">Войти</button>
            
            <div id="errorMessage" style="color: red; display: none; margin-top: 10px;"></div>
        </div>
    </div>

    <script src="/scripts/api.js"></script>
    <script>
        const loginBtn = document.getElementById('loginBtn');
        const loginInput = document.getElementById('loginInput');
        const passwordInput = document.getElementById('passwordInput');
        const errorDiv = document.getElementById('errorMessage');

        // Проверяем параметры URL при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const errorType = urlParams.get('error');
            
            if (errorType === 'blocked') {
                errorDiv.textContent = '🔒 Ваша учетная запись заблокирована. Обратитесь к администратору.';
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#dc3545';
            } else if (errorType === 'unauthorized') {
                errorDiv.textContent = '⏰ Сессия истекла. Пожалуйста, войдите заново.';
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#f59e0b';
            }
        });

        loginBtn.addEventListener('click', async () => {
            const emailOrUsername = loginInput.value.trim();
            const password = passwordInput.value.trim();

            // Очищаем предыдущие ошибки
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!emailOrUsername || !password) {
                errorDiv.textContent = 'Заполните все поля';
                errorDiv.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';

            try {
                const result = await api.auth.login(emailOrUsername, password);
                if (result.success) {
                    // Перенаправляем на главную страницу
                    window.location.href = '/html/admin_base.html';
                }
            } catch (error) {
                console.error('Login error:', error);
                
                // Показываем сообщение об ошибке от сервера
                if (error.message && error.message.includes('заблокирована')) {
                    errorDiv.textContent = '🔒 Ваша учетная запись заблокирована. Обратитесь к администратору.';
                } else {
                    errorDiv.textContent = error.message || 'Неверный логин или пароль';
                }
                errorDiv.style.display = 'block';
                
                // Очищаем поле пароля
                passwordInput.value = '';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });

        // Enter key
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>
</html>
