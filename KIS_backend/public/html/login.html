<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - КИС</title>
    <link rel="stylesheet" type="text/css" href="/styles/main.css">
    <link rel="stylesheet" type="text/css" href="/styles/login.css">
</head>
<body>
    <!-- ===================================================== -->
    <!-- ОБЛАЧНЫЙ ФОН -->
    <!-- ===================================================== -->
    <div class="cloud-background">
        <!-- Большие кучевые облака -->
        <div class="cloud cloud-1">
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
        </div>
        
        <div class="cloud cloud-2">
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
        </div>
        
        <div class="cloud cloud-3">
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
        </div>
        
        <div class="cloud cloud-4">
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
        </div>
        
        <div class="cloud cloud-5">
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
        </div>
        
        <!-- Маленькие облачка для глубины -->
        <div class="cloud-small cloud-small-1">
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
        </div>
        
        <div class="cloud-small cloud-small-2">
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
            <div class="cloud-part"></div>
        </div>
    </div>


    <!-- Слой блюра -->
    <div class="blur-overlay"></div>

    <!-- ===================================================== -->
    <!-- ОКНО ВХОДА -->
    <!-- ===================================================== -->
    <div id="enterbody">
        <div class="welcome-banner">
            <h1>
                КИС ЦРП
            </h1>
            <h2>
                "У нас есть всё, что вам нужно для продуктивной работы
            а ещё кот"
            </h2>
            
        </div>
        <div id="loginwindow">
            <h1 class="text-header">Авторизация</h1>
            
            <div class="inputelem_container text-inner-header">
                <label>Логин / Email</label>
                <input class="inputelem" type="text" id="loginInput" placeholder="Введите логин или email">
            </div>
            
            <div class="inputelem_container text-inner-header">
                <label>Пароль</label>
                <input class="inputelem" type="password" id="passwordInput" placeholder="Введите пароль">
            </div>
            
            <button class="buttonbase log_page_button" id="loginBtn">Войти</button>
            
            <div id="errorMessage" style="color: red; display: none; margin-top: 10px;"></div>
        </div>
    </div>

    <script src="/scripts/api.js"></script>
    <script>
        const loginBtn = document.getElementById('loginBtn');
        const loginInput = document.getElementById('loginInput');
        const passwordInput = document.getElementById('passwordInput');
        const errorDiv = document.getElementById('errorMessage');

        // Проверяем параметры URL при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const errorType = urlParams.get('error');
            
            if (errorType === 'blocked') {
                errorDiv.textContent = '🔒 Ваша учетная запись заблокирована. Обратитесь к администратору.';
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#dc3545';
            } else if (errorType === 'unauthorized') {
                errorDiv.textContent = '⏰ Сессия истекла. Пожалуйста, войдите заново.';
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#f59e0b';
            }
        });

        loginBtn.addEventListener('click', async () => {
            const emailOrUsername = loginInput.value.trim();
            const password = passwordInput.value.trim();

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!emailOrUsername || !password) {
                errorDiv.textContent = 'Заполните все поля';
                errorDiv.style.display = 'block';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Вход...';

            try {
                const result = await api.auth.login(emailOrUsername, password);
                if (result.success) {
                    window.currentUser = result.user;
                    
                    if (result.user.role_id && !result.user.is_super_admin) {
                        try {
                            const permResponse = await fetch(`/api/admin/roles/${result.user.role_id}/permissions`, {
                                headers: { 'Authorization': `Bearer ${result.token}` }
                            });
                            if (permResponse.ok) {
                                const permData = await permResponse.json();
                                window.currentUser.permissions = permData.permissions;
                            }
                        } catch (e) {
                            console.error('Failed to load permissions:', e);
                        }
                    } else if (result.user.is_super_admin) {
                        window.currentUser.permissions = { admin_panel: true };
                    }
                    
                    const hasAdminAccess = result.user.is_super_admin || 
                        (window.currentUser.permissions && window.currentUser.permissions.admin_panel === true);
                    
                    if (hasAdminAccess) {
                        window.location.href = '/html/admin_base.html';
                    } else {
                        window.location.href = '/html/base.html';
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                
                if (error.message && error.message.includes('заблокирована')) {
                    errorDiv.textContent = '🔒 Ваша учетная запись заблокирована. Обратитесь к администратору.';
                } else {
                    errorDiv.textContent = error.message || 'Неверный логин или пароль';
                }
                errorDiv.style.display = 'block';
                
                passwordInput.value = '';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        });

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>
</html>
